services:
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nautilog_api
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://novamap:novamap@db:3306/novamap?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
    volumes:
      - ./Backend:/var/www/html
      - /var/www/html/var
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nautilog

  client:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nautilog_client
    restart: unless-stopped
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost/api
    networks:
      - nautilog

  db:
    image: mysql:8.0
    container_name: nautilog_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novamap
      MYSQL_USER: novamap
      MYSQL_PASSWORD: novamap
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nautilog

  redis:
    image: redis:7-alpine
    container_name: nautilog_redis
    restart: unless-stopped
    command: redis-server --requirepass redis
    ports:
      - "6379:6379"
    networks:
      - nautilog

  nginx:
    image: nginx:alpine
    container_name: nautilog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Backend/public:/var/www/html/public:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - client
    networks:
      - nautilog

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nautilog_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nautilog

volumes:
  db_data:

networks:
  nautilog:
    driver: bridge
