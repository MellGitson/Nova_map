name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend (PHP CS Fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, cs2pr
      - name: Install dependencies
        working-directory: ./Backend
        run: composer install --prefer-dist --no-progress
      - name: Run PHP CS Fixer
        working-directory: ./Backend
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci
      - name: Run ESLint
        working-directory: ./Frontend
        run: npm run lint

  tests-backend:
    name: Tests Backend (PHPUnit)
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nautilog
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: nautilog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
      - name: Install dependencies
        working-directory: ./Backend
        run: composer install --prefer-dist --no-progress
      - name: Run migrations
        working-directory: ./Backend
        env:
          DATABASE_URL: postgresql://nautilog:secret@localhost:5432/nautilog_test
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
      - name: Run tests
        working-directory: ./Backend
        env:
          DATABASE_URL: postgresql://nautilog:secret@localhost:5432/nautilog_test
        run: vendor/bin/phpunit

  tests-frontend:
    name: Tests Frontend (Vitest)
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci
      - name: Run tests
        working-directory: ./Frontend
        run: npm run test --if-present

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [tests-backend, tests-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: false
          tags: nautilog/backend:latest
      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: false
          tags: nautilog/frontend:latest
